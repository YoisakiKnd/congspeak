[workspace]
members = ["crates/core", "crates/teamspeak", "crates/probe", "crates/audio", "apps/native"]
default-members = ["crates/core", "crates/teamspeak", "crates/probe", "apps/native"]
resolver = "2"

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
congspeak-core = { path = "crates/core" }
congspeak-teamspeak = { path = "crates/teamspeak" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "io-std"] }
futures = "0.3"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib.git", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib.git", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }

[patch.crates-io]
audiopus_sys = { path = "vendor/audiopus_sys" }
